x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "200k"
    max-file: "10"

services:
  app:
    build: ./frontend
    working_dir: /home/node/app
    volumes:
      - ./frontend/:/home/node/app
      - node_modules_volume:/home/node/app/node_modules

    command: [ "npm", "run", "dev", "--", "--host" ]

    stop_signal: SIGINT

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    environment:
      - NGROK_CONFIG=/etc/ngrok.yml
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml

  repsy_postgres:
    container_name: "repsy_postgres"
    image: postgres:17-alpine
    ports:
      - "5440:5432"
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: "postgres -c max_connections=150 -c shared_buffers=512MB -c effective_cache_size=1536MB -c maintenance_work_mem=128MB -c checkpoint_completion_target=0.9 -c wal_buffers=16MB -c default_statistics_target=100 -c random_page_cost=1.1 -c effective_io_concurrency=200 -c work_mem=3495kB -c min_wal_size=1GB -c max_wal_size=4GB -c max_worker_processes=2 -c max_parallel_workers_per_gather=1 -c max_parallel_workers=2 -c max_parallel_maintenance_workers=1"
    env_file:
      - '.env'
    logging: *default-logging

  repsy_api:
    stop_signal: SIGINT
    build: ./backend
    working_dir: "/usr/src/app"
    volumes:
      - ./backend:/usr/src/app
    command:
      [
        "uvicorn",
        "infrastructure.api.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ".env"
    logging: *default-logging

  repsy_bot:
    build: ./backend
    stop_signal: SIGINT
    working_dir: "/usr/src/app"
    volumes:
      - ./backend:/usr/src/app
    command: python3 -m bot
    restart: always
    env_file:
      - ".env"

    logging: *default-logging

  repsy_redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --port $REDIS_PORT --save 20 1 --loglevel warning --requirepass $REDIS_PASSWORD
    env_file:
      - ".env"
    volumes:
      - cache:/data

volumes:
  node_modules_volume:
  pgdata:
  cache: